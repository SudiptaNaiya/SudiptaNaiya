name: Update Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution game
        uses: lowlighter/metrics@latest
        with:
          filename: assets/contribution-game.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: SudiptaNaiya

          template: classic

          base: header, activity, community, repositories

          config_timezone: Asia/Kolkata
